const PCOL = {fait:"#0e5c6b", gps:"#e8890c", jamais:"#a3175f"};
const PTXT = {gps:"À faire · tsawer w checki l'GPS (wakef 9oddam l'panneau, précision &lt; 10 m)", jamais:"Jamais fait · mazal ma tsawer, tsawer kamel"};
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const map = L.map("map", {preferCanvas: true}).setView([36.74, 3.06], 11);

let layers = [];
function draw(agent) {
  layers.forEach(l => map.removeLayer(l)); layers = [];
  const keep = f => !agent || f.properties.ag === agent;
  const cells = L.geoJSON(D.cells, {filter: keep, style: f => ({color: "#fff", weight: 1, fillColor: COL[f.properties.e], fillOpacity: .55}),
    onEachFeature: (f, l) => l.bindPopup(`<b>${esc(f.properties.q)}</b> · ${esc(f.properties.c)}<br>${f.properties.v} fait · ${f.properties.a} mazal` + (f.properties.ag ? `<br>${esc(f.properties.ag)}, sortie ${f.properties.s}` : ""))}).addTo(map);
  const coms = new Set(D.cells.features.filter(keep).map(f => f.properties.c));
  const lim = L.geoJSON(D.communes, {filter: f => coms.has(f.properties.c), style: {color: "#16181b", weight: 2.5, fill: false}}).addTo(map);
  const pts = L.layerGroup(D.pts.filter(p => coms.has(p.c)).map(p => L.circleMarker([p.lat, p.lon], {radius: 7, color: "#fff", weight: 2, fillColor: PCOL[p.k], fillOpacity: 1})
    .bindPopup(p.ok ? `<b>Déjà fait${p.d ? " le " + esc(p.d.slice(8, 10) + "/" + p.d.slice(5, 7)) : ""} · ma t3awdouch</b><br>${esc(p.l)}<br><small>${esc(p.q)} · ${esc(p.c)}</small>${p.ph ? `<img src="${esc(p.ph)}" alt="" loading="lazy">` : ""}`
                  : `<b>${PTXT[p.k]}</b><br>${esc(p.l)}<br><small>${esc(p.q)} · ${esc(p.c)}</small>`))).addTo(map);
  layers = [cells, lim, pts];
  if (cells.getBounds().isValid()) map.fitBounds(cells.getBounds(), {padding: [12, 12]});
}
